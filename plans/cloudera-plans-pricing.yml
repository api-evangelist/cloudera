unit:
  name: CCU
  expansion: Cloudera Compute Unit
  note: >-
    Cloudera meters consumption in CCUs (and, for GPU, CGUs). Pricing is per
    CCU-hour for cloud services and per CCU-year for on-premises subscriptions.
    There is NO per-API-call or per-request price anywhere in Cloudera's pricing —
    the API is a control surface over metered compute, not a metered product in
    its own right, so an agent's API usage costs nothing directly and everything
    indirectly through the resources it provisions.
api_pricing:
  metered: false
  note: >-
    Calls to the CDP control plane API are not billed. What they create is —
    createAWSEnvironment, createVwCluster and createAWSCluster each start a
    CCU-hourly meter that runs until the corresponding delete or stop operation.
    This is the single most important cost fact for an agent operating this API.
