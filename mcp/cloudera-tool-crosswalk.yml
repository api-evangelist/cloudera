source: >-
  mcp/cloudera-mcp.yml (four first-party MCP servers) bound against
  openapi/cloudera-*-openapi.yml (19 harvested CDP control plane Swagger
  definitions, 778 operations)
finding: >-
  THE TWO SURFACES DO NOT OVERLAP. Cloudera's published contract and Cloudera's
  published MCP servers describe different products. The 778 operations in
  openapi/ are the CDP Public Cloud CONTROL PLANE (create an environment, scale a
  datalake, provision a virtual warehouse, manage IAM); the 226 MCP tools operate
  INSIDE a running deployment (query an Iceberg table, build a NiFi flow, edit a
  CDV dashboard, run a Cloudera AI job). Not one MCP tool binds to a control plane
  operationId, and not one control plane operation has an agent binding. This is
  a genuine architectural split, not a coverage gap in this crosswalk — recording
  it as zero-overlap is the accurate result.
