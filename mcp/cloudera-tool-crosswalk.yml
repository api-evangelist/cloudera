      Cloudera AI only — createWorkspace, describeWorkspace, listWorkspaces and so
      on — and stops at the workspace boundary. Jobs, models, experiments and
      project files live behind that boundary and are absent from the contract.
    closest_rest: openapi/cloudera-ml-openapi.yml
    binding: adjacent
    confidence: high
  - tool_group: nifi-mcp-server (66 tools)
    reason: >-
      Targets the Apache NiFi API through Knox on a Data Hub or CFM cluster.
      openapi/cloudera-df-openapi.yml and openapi/cloudera-dfworkload-openapi.yml
      manage DataFlow deployments and readyflows at the control plane level; the
      NiFi canvas itself (processors, connections, controller services) is not in
      any Cloudera-published contract.
    closest_rest: openapi/cloudera-dfworkload-openapi.yml
    binding: adjacent
    confidence: high
  - tool_group: iceberg-mcp-server (2 tools)
    reason: >-
      execute_query / get_schema speak SQL to an Impala coordinator. There is no
      REST operation for either; the data plane is not part of the control plane
      contract.
    binding: none
    confidence: high
