- aid: cloudera:manager
  name: Cloudera Manager API
  tags:
  - Cluster
  - Configuration
  - Management
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloudera.github.io/cm_api/
  properties:
  - url: https://cloudera.github.io/cm_api/
    type: Documentation
  - url: https://cloudera.github.io/cm_api/apidocs/v19/
    type: Reference
  - url: >-
      https://docs.cloudera.com/cdp-private-cloud-base/7.1.9/concepts/topics/cm-api-overview.html
    type: GettingStarted
  description: >-
    Cloudera Manager exposes a JSON REST API at /api/v{N} for managing clusters, services, roles, configurations,
    hosts, parcels, tags and audits. Authentication uses HTTP basic auth with the same credentials as
    the Cloudera Manager web UI; subsequent requests can use the session cookie returned on authentication.
- aid: cloudera:cruise-control
