- aid: cloudera:cdp-control-plane
  name: Cloudera CDP Public Cloud Control Plane API
  tags:
  - Cloud
  - Control Plane
  - CDP
  - Environments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudera.com/cdp-public-cloud/cloud/api/topics/mc-api-overview.html
  properties:
  - url: https://docs.cloudera.com/cdp-public-cloud/cloud/api/topics/mc-api-overview.html
    type: Documentation
  - url: https://github.com/cloudera/cdpcurl
    type: CLI
  description: >-
    The Cloudera CDP Public Cloud Control Plane REST API manages CDP environments, datalakes, data hubs,
    machine learning workspaces, data warehouses and data engineering services. Access requires a Cloudera
    user account with an API access key and private key. cdpcurl is the Python CLI for signed calls.
- aid: cloudera:manager
  name: Cloudera Manager API
  tags:
  - Cluster
  - Configuration
  - Management
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cloudera.github.io/cm_api/
  properties:
  - url: https://cloudera.github.io/cm_api/
    type: Documentation
  - url: https://cloudera.github.io/cm_api/apidocs/v19/
    type: Reference
  - url: >-
      https://docs.cloudera.com/cdp-private-cloud-base/7.1.9/concepts/topics/cm-api-overview.html
    type: Overview
  description: >-
    Cloudera Manager exposes a JSON REST API at /api/v{N} for managing clusters, services, roles, configurations,
    hosts, parcels, tags and audits. Authentication uses HTTP basic auth with the same credentials as
    the Cloudera Manager web UI; subsequent requests can use the session cookie returned on authentication.
