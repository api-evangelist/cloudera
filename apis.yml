  properties:
  - url: https://docs.cloudera.com/runtime/7.2.18/cctrl-managing/topics/cctrl-using-rest-api.html
    type: Documentation
  description: >-
    Cruise Control on CDP exposes REST endpoints for rebalancing Kafka clusters, monitoring partition
    load, and triggering anomaly checks.
