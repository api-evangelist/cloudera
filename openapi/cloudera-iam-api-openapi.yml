    SetSamlAuthnRequestSigningKeyRequest:
      type: object
      description: Request object for setting the SAML AuthnRequest signing key and verification certificate.
      x-form-factor: private
      required:
      - samlProvider
      properties:
        samlProvider:
          type: string
          description: The name or CRN of the SAML Provider associated with the signing key.
        authnRequestSigningKey:
          type: string
          description: The private key used for signing AuthnRequests sent from CDP to the customer's SAML provider. It must be in PEM format. It must be non-empty and valid when 'currentAuthnRequestVerificationCertificate' is set. Omitting it from request will remove this key.
          x-sensitive: true
        currentAuthnRequestVerificationCertificate:
          type: string
          description: The certificate used by SAML provider to verify AuthnRequests sent from CDP. It must be in PEM format. It must be non-empty and valid when 'authnRequestSigningKey' is set. Omitting it from request will remove this certificate.
          x-skip-logging: true
        nextAuthnRequestVerificationCertificate:
          type: string
          description: The next verification certificate used by the SAML provider to verify AuthnRequests sent from CDP. It must be in PEM format. It is used for rotating verification certificate, and is expected to be empty after certification rotation completes. When both the current and next AuthnRequest certificates are set, both will appear in the CDP SP SAML metadata, indicating the Identity Provider should validate if either of the certificates validates the signature of the AuthnRequest. Both must be valid certificates, not expired. Once the Identity Provider has been updated with the new CDP SP SAML metadata to use both certificates, the signing key can be updated to correspond to the next certificate, the current certificate set to what had been next, and the next certificate cleared. The CDP SP SAML metadata can then be updated in the Identity Provider to use only a single certificate before the previous certificate expires. This allows rotating the signing key without downtime. Omitting it from request will remove this certificate.
          x-skip-logging: true
