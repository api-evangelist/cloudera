components:
  schemas:
    Error:
      type: object
      description: An object returned on an error.
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
    Endpoints:
      type: object
      description: Object which holds the exposed endpoints for the given cluster.
      required:
      - endpoints
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
          description: The endpoints.
    ListDatahubDiagnosticsRequest:
      type: object
      description: Request object for listing recent Datahub diagnostics collections.
      required:
      - crn
      properties:
        crn:
          type: string
          description: CRN of the DataHub cluster.
    DatahubDatabaseType:
      type: string
      description: 'Database type for datahub. Currently supported values: NONE, NON_HA, HA'
      enum:
      - HA
      - NON_HA
      - NONE
    FinalizeZookeeperToKraftMigrationResponse:
      type: object
      description: Response object to finalization of the Zookeeper to KRaft migration.
      properties:
        operationId:
          type: string
          description: Unique operation ID assigned to this command execution. Use this identifier with 'get-operation' to track status and retrieve detailed results.
        message:
          type: string
          description: This property contains additional information about the status of the migration.
    ListRecipesResponse:
      type: object
      description: Response object for list recipes request.
      required:
      - recipes
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeSummary'
          description: The recipes.
    StackStatus:
      type: string
      description: Status of the stack.
      enum:
      - REQUESTED
      - CREATE_IN_PROGRESS
      - AVAILABLE
      - UPDATE_IN_PROGRESS
      - UPDATE_REQUESTED
      - UPDATE_FAILED
      - BACKUP_IN_PROGRESS
      - BACKUP_FAILED
      - BACKUP_FINISHED
      - RESTORE_IN_PROGRESS
      - RESTORE_FAILED
      - RESTORE_FINISHED
      - RECOVERY_IN_PROGRESS
      - RECOVERY_REQUESTED
      - RECOVERY_FAILED
      - CREATE_FAILED
      - ENABLE_SECURITY_FAILED
      - PRE_DELETE_IN_PROGRESS
      - DELETE_IN_PROGRESS
      - DELETE_FAILED
      - DELETED_ON_PROVIDER_SIDE
      - DELETE_COMPLETED
      - STOPPED
      - STOP_REQUESTED
      - START_REQUESTED
      - STOP_IN_PROGRESS
      - START_IN_PROGRESS
      - START_FAILED
      - STOP_FAILED
      - WAIT_FOR_SYNC
      - MAINTENANCE_MODE_ENABLED
      - AMBIGUOUS
      - UNREACHABLE
      - NODE_FAILURE
      - EXTERNAL_DATABASE_CREATION_IN_PROGRESS
      - EXTERNAL_DATABASE_CREATION_FAILED
      - EXTERNAL_DATABASE_DELETION_IN_PROGRESS
      - EXTERNAL_DATABASE_DELETION_FINISHED
      - EXTERNAL_DATABASE_DELETION_FAILED
      - EXTERNAL_DATABASE_START_IN_PROGRESS
      - EXTERNAL_DATABASE_START_FINISHED
      - EXTERNAL_DATABASE_START_FAILED
      - EXTERNAL_DATABASE_STOP_IN_PROGRESS
      - EXTERNAL_DATABASE_STOP_FINISHED
      - EXTERNAL_DATABASE_STOP_FAILED
      - LOAD_BALANCER_UPDATE_IN_PROGRESS
      - LOAD_BALANCER_UPDATE_FINISHED
      - LOAD_BALANCER_UPDATE_FAILED
    CreateClusterDefinitionRequest:
      type: object
      description: Request object for create cluster definition request.
      required:
      - clusterDefinitionName
      - workloadTemplate
      properties:
        clusterDefinitionName:
          type: string
          description: The name of the cluster definition. This name must be unique, must have between 5 and 100 characters, and must contain only lowercase letters, numbers and hyphens. Names are case-sensitive.
          minLength: 5
          maxLength: 1000
        workloadTemplate:
          type: string
          description: The cluster creation JSON. This must contain the name of a running environment.
        description:
          type: string
          description: The description of the cluster definition. The description can have a maximum of 1000 characters.
          maxLength: 1000
    AttachedVolumeRequest:
      type: object
      description: Configurations for additional attached volumes.
      required:
      - volumeSize
      - volumeCount
      - volumeType
      properties:
        volumeSize:
          type: integer
          format: int32
          description: The attached volume size.
        volumeCount:
          type: integer
          format: int32
          description: The attached volume count.
        volumeType:
          type: string
          description: The attached volume type.
    UpdateToAwsImdsV2Response:
      type: object
      description: Response object for updating Data Hub to AWS IMDSv2.
      properties:
        operationId:
          type: string
          description: Unique operation ID assigned to this command execution. Use this identifier with 'get-operation' to track status and retrieve detailed results.
    HostStatus:
      type: object
      description: Information about cluster host status.
      properties:
        hostid:
          type: string
          description: Unique identifier of the cluster host given by Cloudera Manager.
        hostname:
          type: string
          description: The cluster hostname.
        healthSummary:
          type: string
          description: The host health summary.
    AutoScaleLoadRequest:
      type: object
      description: Configuration for Load Based Scaling
      required:
      - configuration
      properties:
        configuration:
          description: Configuration for Load Based Scaling
          $ref: '#/components/schemas/AutoScaleLoadRequestConfiguration'
        identifier:
          type: string
          minLength: 5
          maxLength: 200
          description: An optional identifier for the rule. Generally useful for debugging. Will be auto-generated if none is provided.
        description:
          type: string
          minLength: 0
          maxLength: 1000
          description: An optional description for the specific schedule.
    IndividualScheduleResponse:
      type: object
      description: An individual schedule based policy
      required:
      - configuration
      - identifier
      properties:
        configuration:
          type: object
          description: The schedule configuration.
          required:
          - trigger
          - action
          properties:
            trigger:
              type: object
              description: The trigger for this rule.
              required:
              - cronExpression
              - timeZone
              properties:
                cronExpression:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The cron expression for this schedule
                timeZone:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: The time zone for the cron expression
            action:
              type: object
              description: The scaling action to take when triggered.
              required:
              - resourceAdjustmentValue
              properties:
                resourceAdjustmentType:
                  type: string
                  enum:
                  - ABSOLUTE_COUNT
                  description: The type of resource adjustment. Only ABSOLUTE_COUNT supported at the moment.
                resourceAdjustmentValue:
                  type: integer
                  format: int32
                  description: The target value for the resource based on the AdjustmentType
        identifier:
          type: string
          description: An identifier fot the specific schedule. Generally usefulf for debugging.
        description:
          type: string
          description: Description for the specified schedule.
    AttachedVolumeDetail:
      type: object
      description: The attached volume configuration.
      properties:
        count:
          type: integer
          format: int32
          description: The number of volumes.
        volumeType:
          type: string
          description: The type of volumes.
        size:
          type: integer
          format: int32
          description: The size of each volume in GB.
    DatahubLoadBalancerSkuType:
      type: string
      description: Represents the Azure load balancer SKU type. The current default is BASIC. To disable the load balancer, use type NONE.
      enum:
      - BASIC
      - STANDARD
      - NONE
    UpdateAutoScaleRulesRequest:
      type: object
      description: Autoscale Modification request
      required:
      - clusterName
      properties:
        clusterName:
          type: string
          minLength: 5
          maxLength: 500
          description: The name or CRN of the cluster.
        enabled:
          type: boolean
          description: true to enable Autoscaling, false to disable AutoScaling. If not specified, the existing value is used.
        autoScalePolicies:
          description: The actual scaling policies for the cluster
          type: array
          items:
            $ref: '#/components/schemas/AutoScalePolicyRequest'
    DescribeClusterRequest:
      type: object
      description: Request object for describe cluster request.
      required:
      - clusterName
      properties:
        clusterName:
          type: string
          description: The name or CRN of the cluster.
    AutoScaleScheduleRequest:
      type: object
      description: Schedule for AutoScaling
      properties:
        schedules:
          description: List of individual schedules
          type: array
          items:
            $ref: '#/components/schemas/IndividualScheduleRequest'
    CancelDatahubDiagnosticsResponse:
      type: object
      description: Response object for cancel running Datahub diagnostics collections.
    Endpoint:
      type: object
      description: Object which holds the exposed endpoint.
      required:
      - serviceName
      - serviceUrl
      - displayName
      - knoxService
      - mode
      - open
      properties:
        serviceName:
          type: string
          description: The name of the exposed service
        serviceUrl:
          type: string
          description: The server url for the given exposed service's API.
        displayName:
          type: string
          description: The more consumable name of the exposed service.
        knoxService:
          type: string
          description: The related knox entry.
        mode:
          type: string
          description: The SSO mode of the given service.
        open:
          type: boolean
          description: The access status of the given endpoint. Whether its open or not.
    UpgradeClusterRequest:
      type: object
      description: Request object to upgrade datahub.
      required:
      - clusterName
      properties:
        clusterName:
          type: string
          description: The name or CRN of the datahub.
        imageId:
          type: string
          description: The id of an image to upgrade to.
        runtime:
          type: string
          description: The runtime version to upgrade to.
        lockComponents:
          type: boolean
          description: Perform an os upgrade only.
        dryRun:
          type: boolean
          description: Checks the eligibility of an image to upgrade but do not perform the upgrade.
        showAvailableImages:
          type: boolean
          description: Returns the list of images that are eligible for the upgrade.
        showLatestAvailableImagePerRuntime:
          type: boolean
          description: Returns the latest image that is eligible for the upgrade for each runtime version with at least one available upgrade candidate.
        rollingUpgradeEnabled:
          type: boolean
          description: Enables the ability to perform rolling runtime upgrade.
    AutoScalePolicyRequest:
      type: object
      description: An individual AutoScale Policy
      required:
      - hostGroups
      properties:
        hostGroups:
          description: A single hostgroup, or a comma separated list of hostGroups to which the rules apply
          type: string
          minLength: 1
          maxLength: 200
        scheduleBasedPolicy:
          description: Scheduled based policy
          $ref: '#/components/schemas/AutoScaleScheduleRequest'
        loadBasedPolicy:
          description: Load based policy
          $ref: '#/components/schemas/AutoScaleLoadRequest'
    VolumeEncryptionRequest:
      type: object
      description: Configurations for volume encryption.
      properties:
        enableEncryption:
          type:
          - boolean
          - 'null'
          description: Enable encyrption for all volumes in the instance group. Default is false.
        encryptionKey:
          type: string
          description: The ARN of the encryption key to use. If nothing is specified, the default key will be used.
    Instance:
      type: object
      description: Object which holds some details of an instance for the given cluster.
      required:
      - id
      - state
      - instanceType
      properties:
        id:
          type: string
          description: The ID of the given instance.
        state:
          type: string
          description: The health state of the instance. UNHEALTHY represents instances with unhealthy services, lost instances, or failed operations.
        instanceType:
          type: string
          description: The type of the given instance (either GATEWAY, GATEWAY_PRIMARY, or CORE).
        privateIp:
          type: string
          description: The private IP of the given instance.
        publicIp:
          type: string
          description: The public IP of the given instance.
        fqdn:
          type: string
          description: The FQDN of the instance.
        status:
          type: string
          description: The status of the instance. This includes information like whether the instance is being provisioned, stopped, decommissioning failures etc.
        statusReason:
          type: string
          description: The reason for the current status of this instance.
        sshPort:
          type: integer
          format: int32
          description: The SSH port for the instance.
        clouderaManagerServer:
          type: boolean
          description: Whether the instance has Cloudera Manager deployed or not.
        instanceGroup:
          type: string
          description: The name of the instance group this instance belongs to.
        attachedVolumes:
          type: array
          description: List of volumes attached to this instance.
          items:
            $ref: '#/components/schemas/AttachedVolumeDetail'
        availabilityZone:
          type: string
          description: The availability zone of the instance.
        instanceVmType:
          type: string
          description: The VM type of the instance. Supported values depend on the cloud platform.
        rackId:
          type: string
          description: The rack ID of the instance in Cloudera Manager.
        subnetId:
          type: string
          description: The subnet ID of the instance.
    DeleteRecipesRequest:
      type: object
      description: Request object for delete recipe request.
      required:
      - recipeNames
      properties:
        recipeNames:
          type: array
          items:
            type: string
          description: The names or CRNs of the recipes to be deleted.
    RollbackZookeeperToKraftMigrationResponse:
      type: object
      description: Response object to rollback the migration from Zookeeper to KRaft broker.
      properties:
        operationId:
          type: string
          description: Unique operation ID assigned to this command execution. Use this identifier with 'get-operation' to track status and retrieve detailed results.
        message:
          type: string
          description: This property contains additional information about the status of the migration.
    ClusterDefinitionSummary:
      type: object
      description: Information about a cluster definition.
      required:
      - clusterDefinitionName
      - crn
      properties:
        clusterDefinitionName:
          type: string
          description: The name of the cluster definition.
        crn:
          type: string
          description: The CRN of the cluster definition.
        type:
          type: string
          description: The type of cluster definition.
        nodeCount:
          type: integer
          format: int32
          description: The node count of the cluster.
        cloudPlatform:
          type: string
          description: The cloud platform.
        productVersion:
          type: string
          description: The product version.
        environmentCrn:
          type: string
          description: The CRN of the environment.
        description:
          type: string
          description: The description of the cluster definition.
    MigrateZookeeperToKraftResponse:
      type: object
      description: Response object to migrate Zookeeper to KRaft.
      properties:
        operationId:
          type: string
          description: Unique operation ID assigned to this command execution. Use this identifier with 'get-operation' to track status and retrieve detailed results.
        message:
          type: string
          description: This property contains additional information about the status of the migration.
    DescribeClusterDefinitionResponse:
      type: object
      description: Response object for describe cluster definition response.
      required:
      - clusterDefinition
      properties:
        clusterDefinition:
          $ref: '#/components/schemas/ClusterDefinition'
          description: The clusterDefinition.
    ClusterRdsDetails:
      description: Details of the RDS attached to cluster.
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID of RDS.
        name:
          type: string
          description: Name of RDS.
        description:
          type: string
          description: Description of RDS.
        connectionURL:
          type: string
          description: Connection URL of RDS.
        sslMode:
          type: string
          description: SSL mode.
        databaseEngine:
          type: string
          description: Database engine.
        connectionDriver:
          type: string
          description: Connection driver.
        creationDate:
          type: string
          format: date-time
          description: RDS creation date.
        stackVersion:
          type: string
          description: Stack version.
        status:
          type: string
          description: Status of RDS.
        type:
          type: string
          description: Type of RDS.
        connectorJarUrl:
          type: string
          description: Connector Jar URL.
        workspaceId:
          type: integer
          format: int64
          description: Workspace ID.
        userId:
          type: string
          description: User ID.
        userName:
          type: string
          description: User name.
        tenantName:
          type: string
          description: RDS tenant name.
        external:
          type: boolean
          description: Set to true if RDS is external.
    SetDefaultJavaVersionRequest:
      type: object
      description: Request object for setting the default Java version on the Data Hub cluster.
      required:
      - clusterCrn
      - javaVersion
      properties:
        clusterCrn:
          type: string
          description: The CRN of the Data Hub cluster.
        javaVersion:
          type: string
          description: The Java version to set as default.
        rollingRestart:
          default: false
          type: boolean
          description: If set to true Cloudera Manager will use Rolling Restart to restart services running on the cluster. This operation can take a long time. Default value is false.
    Cluster:
      type: object
      description: Information about a cluster.
      required:
      - clusterName
      - crn
      properties:
        clusterName:
          type: string
          description: The name of the cluster.
        crn:
          type: string
          description: The CRN of the cluster.
        creationDate:
          type: string
          format: date-time
          description: The date when the cluster was created.
        status:
          type: string
          description: The status of the stack.
        clusterStatus:
          type: string
          description: The status of the cluster. It always returns the same value as the status field. Deprecated.
          x-deprecated: true
        nodeCount:
          type: integer
          format: int32
          description: The cluster node count.
        instanceGroups:
          type: array
          items:
            $ref: '#/components/schemas/InstanceGroup'
          description: The instance details.
        workloadType:
          type: string
          description: The workload type for the cluster.
        cloudPlatform:
          type: string
          description: The cloud platform.
        imageDetails:
          $ref: '#/components/schemas/ImageDetails'
          description: The image details.
        environmentCrn:
          type: string
          description: The CRN of the environment.
        credentialCrn:
          type: string
          description: The CRN of the credential.
        datalakeCrn:
          type: string
          description: The CRN of the attached datalake.
        clusterTemplateCrn:
          type: string
          description: The CRN of the cluster template used for the cluster creation.
        statusReason:
          type: string
          description: The status reason.
        clouderaManager:
          $ref: '#/components/schemas/ClouderaManagerDetails'
          description: The Cloudera Manager details.
        endpoints:
          $ref: '#/components/schemas/Endpoints'
          description: The exposed service api endpoints.
        multiAz:
          default: false
          type: boolean
          description: Flag that toggles the multi availability zone for the given datahub cluster when you are not sure what subnet IDs can be used. This way the subnet IDs will be used what the environment suggests.
    AutoScaleLoadRequestConfiguration:
      type: object
      description: Configuration for load based scaling
      required:
      - minResourceValue
      - maxResourceValue
      properties:
        minResourceValue:
          type: integer
          format: int32
          minimum: 0
          description: The lower bound for the resource
        maxResourceValue:
          type: integer
          format: int32
          minimum: 0
          description: The upper bound for the resource
        coolDownMinutes:
          type: integer
          description: Minimum time, in minutes, between autoscale activity
          format: int32
