openapi: 3.2.0
info:
  version: 0.9.163
  title: Cloudera Service Compute API
  license:
    name: Apache 2.0
  description: Defining service of compute public API service
  termsOfService: https://www.cloudera.com/legal/commercial-terms-and-conditions.html
tags:
- name: Compute
paths:
  /api/v1/compute/createCluster:
    post:
      summary: Create compute cluster
      description: Creates compute cluster.
      operationId: createCluster
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/deleteCluster:
    post:
      summary: Delete compute cluster
      description: Deletes compute cluster.
      operationId: deleteCluster
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/describeCluster:
    post:
      summary: Describe compute cluster
      description: Describe compute cluster details in a CDP Environment
      operationId: describeCluster
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/describeDeployment:
    post:
      summary: Describes a deployment
      description: Gets a single deployment along with its extended history. This can also include all of the known templates.
      operationId: describeDeployment
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeDeploymentResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeDeploymentRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/getOperationDetails:
    post:
      summary: GetOperationDetails
      description: To get detailed information about the long running operation.
      operationId: getOperationDetails
      x-entitlement: COMPUTE_API_LIFTIE
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOperationDetailsResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOperationDetailsRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/getOperationStatus:
    post:
      summary: GetOperationStatus
      description: A lightweight API to get status of a long running operation.
      operationId: getOperationStatus
      x-entitlement: COMPUTE_API_LIFTIE
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOperationStatusResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOperationStatusRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/listClusters:
    post:
      summary: List compute clusters
      description: List all compute clusters in a CDP Environment
      operationId: listClusters
      x-paging-default-max-items: 100
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClustersResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListClustersRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/listDeployments:
    post:
      summary: List deployments in the cluster
      description: Lists the helm charts that are available for deployment or have already been deployed in this cluster.
      operationId: listDeployments
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDeploymentsResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDeploymentsRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/resumeCluster:
    post:
      summary: Resume Cluster
      description: Resumes the compute cluster
      operationId: resumeCluster
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/retryOperation:
    post:
      summary: ResetOperation
      description: To reset a failed operation for retry.
      operationId: retryOperation
      x-entitlement: COMPUTE_API_LIFTIE
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryOperationResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryOperationRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/suspendCluster:
    post:
      summary: Suspend Cluster
      description: Suspends the compute cluster
      operationId: suspendCluster
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuspendClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/updateCluster:
    post:
      summary: Update cluster
      description: Updates compute cluster.
      operationId: updateCluster
      x-entitlement: COMPUTE_API_LIFTIE
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/upgradeCluster:
    post:
      summary: Upgrade kubernetes version of the cluster
      description: Upgrades the kubernetes version of the cluster to the specified version.
      operationId: upgradeCluster
      x-entitlement: COMPUTE_API_LIFTIE
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeClusterRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/upgradeDeployment:
    post:
      summary: Upgrades a deployment to a different chart
      description: Upgrades a deployment to a different chart.
      operationId: upgradeDeployment
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeDeploymentResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeDeploymentRequest'
        required: true
      tags:
      - Compute
  /api/v1/compute/validateCluster:
    post:
      summary: Validate compute cluster
      description: Validates compute cluster.
      operationId: validateCluster
      x-form-factors: public
      responses:
        200:
          description: Expected response to a valid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateClusterResponse'
        default:
          description: The default response on an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-mutating: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateClusterRequest'
        required: true
      tags:
      - Compute
components:
  schemas:
    CommonMeteringResp:
      type: object
      description: Metering response structure.
      properties:
        enabled:
          type: boolean
          description: Flag to indicate if Monitoring is enabled.
        services:
          type: array
          items:
            $ref: '#/components/schemas/CommonMeteringServiceResp'
          description: Array of services.
      x-form-factors: public
    Error:
      type: object
      description: An object returned on an error.
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
    AppWorkflowStatus:
      type: object
      description: Status of an application workflow.
      properties:
        workflowStatus:
          description: Workflow status.
          $ref: '#/components/schemas/ExecutionStatus'
        message:
          type: string
          description: Additional details regarding workflow status.
        appCrn:
          type: string
          description: Application CRN.
        startTime:
          type: string
          format: date-time
          description: The start time of the workflow.
        lastUpdateTime:
          type: string
          format: date-time
          description: The last time the workflow status was updated.
    CommonApiServerResp:
      type: object
      description: API server response structure.
      properties:
        authorizedIpRanges:
          type: array
          items:
            type: string
          description: An array of IPv4 CIDR blocks.
        enabled:
          type: boolean
          description: Flag to indicate if whitelist of IP Ranges (CIDR block) for public access to the kubernetes API server is enabled.
      x-form-factors: public
    AksPoolInstance:
      type: object
      description: AKS pool instance response structure.
      properties:
        name:
          type: string
          description: Name.
        instanceId:
          type: string
          description: Instance ID.
        availabilityZone:
          type: string
          description: Availability zone.
        subnetId:
          type: string
          description: Subnet ID.
      x-form-factors: public
    AvailableDeploymentUpgrade:
      type: object
      description: Available deployment upgrade structure.
      properties:
        applicationVersion:
          type: string
          description: The version of the components which would be installed from this deployment.
        deploymentVersion:
          type: string
          description: The version of the deployment that is available to upgrade to.
    ComputeClusterOwner:
      type: object
      description: Compute cluster owner structure.
      properties:
        email:
          type: string
          description: Owner's email.
        firstName:
          type: string
          description: Owner's firstname.
        lastName:
          type: string
          description: Owner's lastname.
        userId:
          type: string
          description: Owner's user ID.
        accountId:
          type: string
          description: Owner's account ID.
        crn:
          type: string
          description: Owner's actor CRN.
      x-form-factors: public
    CommonMonitoringResp:
      type: object
      description: Monitoring response structure.
      properties:
        enabled:
          type: boolean
          description: Flag to indicate if Monitoring is enabled.
        alertmanager:
          description: Alertmanager.
          $ref: '#/components/schemas/CommonAlertmanagerResp'
        serverResourceLimits:
          description: Server resource limits.
          $ref: '#/components/schemas/CommonResourceLimitsResp'
      x-form-factors: public
    AppWorkflowDetail:
      type: object
      description: Details of an application workflow.
      properties:
        workflowStatus:
          description: Workflow status.
          $ref: '#/components/schemas/ExecutionStatus'
        message:
          type: string
          description: Additional details regarding workflow status.
        appCrn:
          type: string
          description: Application CRN.
        startTime:
          type: string
          format: date-time
          description: The start time of the workflow.
        lastUpdateTime:
          type: string
          format: date-time
          description: The last time the workflow status was updated.
        domain:
          type: string
          description: Domain of workflow.
        taskList:
          type: string
          description: List of tasks for workflows.
        workflowName:
          type: string
          description: Name of the workflow.
        workflowId:
          type: string
          description: Cadence workflow ID.
        runId:
          type: string
          description: Cadence run ID.
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
          description: Activities
    UpgradeDeploymentResponse:
      type: object
      description: Response structure for upgrading a deployment.
      properties:
        name:
          type: string
          description: The name of the deployment.
        namespace:
          type: string
          description: The namespace of the deployment.
        revision:
          type: integer
          format: int32
          description: Helm revision.
        message:
          type: string
          description: A message returned about the status of the upgrade operation.
        status:
          type: string
          description: Status of the deployment. Currently supported values are UNKNOWN, DEPLOYED, UNINSTALLED, SUPERSEDED, FAILED, PENDING-INSTALL, PENDING-UPGRADE and PENDING-ROLLBACK. New values may be added in the future.
        chart:
          description: Chart that the deployment was created from.
          $ref: '#/components/schemas/Chart'
    EnvCloudProvider:
      type: string
      description: "Object representing cloud provider type for Cloudera environment.\n `AWS` - Cloudera environment installed in AWS. `AZURE` - Cloudera environment installed in Azure. `OPENSHIFT` - Cloudera environment installed as on-premises installation using OpenShift in the base cluster. `GCP` - Cloudera environment installed in GCP. `REDHAT` - Cloudera environment installed as an on-premises deployment using Red Hat infrastructure. `KCLOUD` - Cloudera environment installed as an on-premises deployment using KCLOUD infrastructure. `STANDARD` - Cloudera environment installed as a generic on-premises deployment using CDP Data services."
      enum:
      - AWS
      - AZURE
      - OPENSHIFT
    DescribeClusterRequest:
      type: object
      description: Request object for describing a cluster.
      required:
      - clusterCrn
      properties:
        clusterCrn:
          type: string
          description: Compute cluster CRN.
    PhaseWorkflowDetail:
      type: object
      description: Details of phase workflow.
      properties:
        workflowPhase:
          description: Workflow phase.
          $ref: '#/components/schemas/WorkflowPhase'
        workflowStatus:
          description: Workflow status.
          $ref: '#/components/schemas/ExecutionStatus'
        message:
          type: string
          description: Additional details regarding workflow status.
        startTime:
          type: string
          format: date-time
          description: The start time of the workflow.
        lastUpdateTime:
          type: string
          format: date-time
          description: The last time the workflow status was updated.
        workflowId:
          type: string
          description: Cadence workflow ID.
        runId:
          type: string
          description: Cadence run ID.
        appWorkflowDetails:
          type: array
          items:
            $ref: '#/components/schemas/AppWorkflowDetail'
          description: Details of application workflow.
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
          description: Activities
    UpgradeClusterRequest:
      type: object
      description: Request structure to upgrade the cluster kubernetes version.
      required:
      - clusterCrn
      properties:
        clusterCrn:
          type: string
          description: Compute cluster CRN.
        dryRun:
          type: boolean
          description: Flag to only run validations.
    CommonNetwork:
      type: object
      description: Network structure.
      properties:
        subnets:
          type: array
          items:
            type: string
          description: Subnets.
        podCidr:
          type: string
          description: The pod CIDR to use if the backend provider supports setting this.
        serviceCidr:
          type: string
          description: The CIDR for services declared inside of Kubernetes if the backend provider supports setting this.
        outboundType:
          type: string
          description: Cluster outbound type. Currently supported is udr.
      x-form-factors: public
    DescribeDeploymentResponse:
      type: object
      description: Response structure for describing a deployment.
      properties:
        deployment:
          description: Deployment details.
          $ref: '#/components/schemas/Deployment'
        history:
          type: array
          items:
            $ref: '#/components/schemas/History'
          description: History of the deployment.
        overrides:
          type: string
          description: Escaped JSON overrides for the deployment's properties. Deprecated.
          x-deprecated: true
    CommonStorageSpecResp:
      type: object
      description: Storage spec response structure.
      properties:
        csiEnabled:
          type: boolean
          description: Flag to enable CSI (Container Storage Interface). It further sets specific inline cloud formation policies required for CSI.
      x-form-factors: public
    ResumeClusterRequest:
      type: object
      description: Request structure to resume the compute cluster
      required:
      - clusterCrn
      properties:
        clusterCrn:
          type: string
          description: Compute cluster CRN.
        skipValidation:
          type: boolean
          description: Whether to skip validation.
      x-form-factors: public
    CreateClusterRequest:
      type: object
      description: Request object for creating a cluster.
      required:
      - environment
      - name
      properties:
        environment:
          type: string
          description: Environment CRN. Required.
        name:
          type: string
          description: Cluster name. Required.
        description:
          type: string
          description: Cluster description.
        tags:
          type: object
          description: Cluster level tags.
          additionalProperties:
            type: string
        network:
          description: Network.
          $ref: '#/components/schemas/CommonNetwork'
        skipValidation:
          type: boolean
          description: Skip validation.
      x-form-factors: public
    UpgradeClusterResponse:
      type: object
      description: Response structure for upgrading the cluster kubernetes version.
      properties:
        operationId:
          type: string
          description: The unique ID of the initiated long running upgrade operation.
      x-form-factors: public
    GetOperationDetailsResponse:
      type: object
      description: Represents the response containing the details of an operation.
      properties:
        operationId:
          type: string
          description: The unique ID of the operation.
        workflowOperation:
          description: The type of workflow for this operation.
          $ref: '#/components/schemas/WorkflowOperation'
        operationStatus:
          description: The current status of the operation.
          $ref: '#/components/schemas/ExecutionStatus'
        message:
          type: string
          description: Additional details regarding operation status.
        clusterCrn:
          type: string
          description: The CRN of the cluster associated with the operation.
        startTime:
          type: string
          format: date-time
          description: The start time of the operation.
        lastUpdateTime:
          type: string
          format: date-time
          description: The last time the operation status was updated.
        operationOwner:
          description: Details of operation owner.
          $ref: '#/components/schemas/OperationOwner'
        retryCount:
          type: integer
          format: int32
          description: Number of retires attempted. Its value is 0 for first operation.
        workflowId:
          type: string
          description: Cadence workflow ID.
        runId:
          type: string
          description: Cadence run ID.
        phaseWorkflowDetails:
          type: array
          items:
            $ref: '#/components/schemas/PhaseWorkflowDetail'
          description: Details of workflow phases.
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
          description: Activities
    AksNodePool:
      type: object
      description: AKS node pool response structure.
      properties:
        name:
          type: string
          description: Name.
        type:
          type: string
          description: Type.
        provisioningState:
          type: string
          description: Provisioning state.
        instances:
          type: array
          items:
            $ref: '#/components/schemas/AksPoolInstance'
          description: AKS pool instance.
        availabilityZones:
          type: array
          items:
            type: string
          description: Availability zones.
      x-form-factors: public
    CommonResourceLimitsResp:
      type: object
      description: Resource limits response structure.
      properties:
        cpu:
          type: string
          description: Prometheus server CPU limit (default 1000m).
        memory:
          type: string
          description: Prometheus server memory limit (default 2048M).
      x-form-factors: public
    History:
      type: object
      description: History structure.
      properties:
        revision:
          type: integer
          format: int32
          description: Helm revision.
        status:
          type: string
          description: Status of the deployment. Currently supported values are UNKNOWN, DEPLOYED, UNINSTALLED, SUPERSEDED, FAILED, PENDING-INSTALL, PENDING-UPGRADE and PENDING-ROLLBACK. New values may be added in the future.
        chart:
          description: Chart that the deployment was created from.
          $ref: '#/components/schemas/Chart'
        overrides:
          type: string
          description: Escaped JSON overrides for the deployment's properties for given revision.
    ListDeploymentsResponse:
      type: object
      description: Response structure to list deployments in the cluster.
      properties:
        availableCharts:
          type: array
          items:
            $ref: '#/components/schemas/Chart'
          description: Array of available charts.
        unavailableCharts:
          type: array
          items:
            $ref: '#/components/schemas/Chart'
          description: Array of unavailable charts.
        installedDeployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
          description: Array of installed deployments.
    CommonYuniKornResp:
      type: object
      description: YuniKorn response structure.
      properties:
        enabled:
          type: boolean
          description: Flag to indicate if yunikorn is enabled.
        version:
          type: string
          description: Version. Deprecated.
          x-deprecated: true
        appSortingPolicy:
          type: string
          description: The app sorting policy. Deprecated.
          x-deprecated: true
        nodeSortingPolicy:
          type: string
          description: The node sorting policy. Deprecated.
          x-deprecated: true
      x-form-factors: public
    SuspendClusterResponse:
      type: object
      description: Response structure for suspending the compute cluster
      properties:
        clusterStatus:
          description: Cluster status.
          $ref: '#/components/schemas/CommonStatusMessage'
        validationResponse:
          description: Pre-flight validation check response. Only given on a validation failure and `skipValidation` is false.
          $ref: '#/components/schemas/ValidationResponse'
      x-form-factors: public
    ComputeClusterType:
      type: string
      description: "Object representing compute cluster types.\n `Shared` - Value representing a shared compute cluster. `DedicatedExternal` - Value representing an external dedicated compute cluster. `Dedicated` - Value representing an embedded dedicated compute cluster."
      enum:
      - Shared
      - DedicatedExternal
      - Dedicated
    CommonInstanceRequirementsResp:
      type: object
      description: Instance requirements structure.
      properties:
        allowedInstanceTypes:
          type: array
          items:
            type: string
          description: Instance types to include.
        cpuTypes:
          type: array
          items:
            type: string
