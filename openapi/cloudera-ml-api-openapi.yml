components:
  schemas:
    DescribeWorkspaceResponse:
      type: object
      description: Response object for the DescribeWorkspace method.
      required:
      - workspace
      properties:
        workspace:
          description: The workbench.
          $ref: '#/components/schemas/Workspace'
    Error:
      type: object
      description: An object returned on an error.
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
    UpgradeMlServingAppRequest:
      type: object
      description: Request object for the UpgradeMlServingApp method.
      required:
      - appCrn
      properties:
        appCrn:
          type: string
          description: The Cloudera AI Inference Service CRN.
    ProvisionTag:
      type: object
      description: Contains a single tag entry that will be configured on cloud resources associated with a workbench.
      required:
      - key
      - value
      properties:
        key:
          type: string
          description: The name for the tag.
        value:
          type: string
          description: The value for the tag.
    UpdateMlServingAppS3CredsRequest:
      type: object
      description: Request object for the UpdateMlServingAppS3Creds method.
      required:
      - appCrn
      - s3Creds
      properties:
        appCrn:
          type: string
          description: The CRN of the Cloudera AI Inference Service to update.
        s3Creds:
          description: The S3 credentials to update.
          $ref: '#/components/schemas/MlServingOzoneCreds'
        registryNamespace:
          type: string
          description: The namespace of the AI Registry
        linkRegistry:
          type: boolean
          description: Whether to link the registry
        envName:
          type: string
          description: The environment name of the linked registry
      x-form-factors: private
    ListWorkspaceAccessRequest:
      type: object
      description: Request object for the ListWorkspace method.
      properties:
        environmentName:
          type: string
          description: The environment that the workbench is a member of.
        workspaceName:
          type: string
          description: The name of the workbench to list access.
        workspaceCrn:
          type: string
          description: The CRN of the workbench to list access. If CRN is specified only the CRN is used for identifying the workbench, environment and name arguments are ignored.
    ListRelevantInstancesRequest:
      type: object
      description: Request object for the ListRelevantInstances method.
      required:
      - instanceCategory
      - requestInfo
      - environmentName
      - productType
      properties:
        instanceCategory:
          type: string
          description: Defines the category of the instance (e.g., CPU, GPU) relevant for the query in the specified region.
        requestInfo:
          description: Specifies the requested resource inputs eg (CPU/GPU, model, memory etc).
          $ref: '#/components/schemas/RequestResourceInfo'
        environmentName:
          type: string
          description: Specifies the environment name of respective cloud provider for which instance support details are requested.
        productType:
          type: string
          description: Specifies the product type for which instance support details are requested.
        region:
          type: string
          description: Deprecated. Please use environmentName instead, from which the region will be determined.
          x-deprecated: true
        cloudProvider:
          type: string
          description: Deprecated. Please use environmentName instead, from which the cloud provider will be determined.
          x-deprecated: true
    DescribeModelRegistryResponse:
      type: object
      description: Response object for the DescribeModelRegistry method.
      required:
      - modelRegistry
      properties:
        modelRegistry:
          description: The registry.
          $ref: '#/components/schemas/ModelRegistry'
    DescribeWorkspaceRequest:
      type: object
      description: Request object for the DescribeWorkspace method.
      properties:
        environmentName:
          type: string
          description: The environment for the workbench to describe.
        workspaceName:
          type: string
          description: The name of the workbench to describe.
        workspaceCrn:
          type: string
          description: The CRN of the workbench to describe. If CRN is specified only the CRN is used for identifying the workbench, environment and name arguments are ignored.
    ListWorkspaceBackupsQueryOptions:
      type: object
      description: Query options object for ListWorkspaceBackups method.
      properties:
        expandEnvironmentMetadata:
          type: boolean
          description: When set to true, will return the metadata of the environment where the backed-up workbench is/was present.
    DescribeMlServingAppResponse:
      type: object
      description: Response object for the DescribeMlServingApp method.
      properties:
        app:
          description: The Cloudera AI Inference Service instance.
          $ref: '#/components/schemas/MlServingApp'
    GetModelRegistryKubeconfigRequest:
      type: object
      description: Request object for GetModelRegistryKubeconfig.
      properties:
        modelRegistryCrn:
          type: string
          description: CRN of the Model Registry
    GrantMlServingAppAccessResponse:
      type: object
      description: Response object for the GrantMlServingAppAccess method.
      required:
      - kubeconfig
      properties:
        kubeconfig:
          type: string
          description: The Kubernetes config file
          x-sensitive: true
    GetLatestModelRegistryVersionResponse:
      type: object
      description: Response object for GetLatestModelRegistryVersion.
      required:
      - version
      properties:
        version:
          type: string
          description: The latest version of a modelregistry that is used when deploying Cloudera AI ModelRegistries.
    GetLatestWorkspaceVersionResponse:
      type: object
      description: Response object for GetLatestWorkspaceVersion.
      required:
      - version
      properties:
        version:
          type: string
          description: The latest version of a workbench that is used when deploying Cloudera AI workbenches.
    RequestWorkflowRollbackResponse:
      type: object
      description: Response object for RequestRollbackCancellation.
      properties:
        workflowMetadata:
          type: array
          items:
