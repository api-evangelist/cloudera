deprecation:
  policy_present: true
  policy_url: https://www.cloudera.com/services-and-support/support-lifecycle-policy.html
  http_status: 200
  mechanism: support-lifecycle-phases
  phases:
    - name: Full Support
      description: >-
        Documentation, knowledge base, case creation, escalation, root cause
        analysis and cumulative hotfixes.
    - name: End of Support / End of Maintenance
      description: >-
        Limited phase in which, in Cloudera's words, "the only mechanism to
        assist customers will be upgrades to the latest release".
    - name: End of Life
      description: >-
        Support terminates. Documentation and knowledge base articles may remain
        accessible.
  stated_durations:
    - scope: Cloudera Manager
      rule: >-
        A version reaches End of Support a minimum of 18 months following the
        general availability of the subsequent release.
    - scope: Cloud data services
      rule: Six months of full support, then exception phases before end of life.
    - scope: Long Term Support releases
      rule: >-
        Extended — Cloudera Base on premises 7.1.9 carries an end-of-support date
        of October 2028.
  forward_dates_caveat: >-
    Cloudera states that all future dates are for planning purposes only and are
    subject to change, "but with the expectation that dates may move later but
    will not move earlier".
  http_headers:
    rfc8594_sunset: false
    deprecation_header: false
    note: >-
      No Sunset or Deprecation response header was observed on any probe of
      https://api.us-west-1.cdp.cloudera.com. Deprecation is announced in
      documentation and in the Swagger, never at runtime — an agent calling a
      deprecated operation gets no signal on the wire.
  in_contract:
    deprecated_operations: 5
    note: >-
      Cloudera does mark deprecation in the contract itself, using the OpenAPI
      `deprecated: true` flag AND naming the replacement in the summary. All five
