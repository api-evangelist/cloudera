versioning:
  scheme: single-major-in-path
  current: v1
  path: /api/v1/{service}/{operation}
  contract_version: 0.9.163
  contract_version_note: >-
    info.version on all 19 published Swagger definitions. It tracks the control
    plane build, not a public API major version — the path has stayed /api/v1
    across every CDP release. cdpcli 0.9.163 on PyPI carries the same number, so
    the CLI release IS the contract release.
  breaking_change_policy: >-
    Not published for the control plane API. Cloudera's own custom x- extension
    properties in the Swagger carry an explicit warning that they "are subject to
    change at any time" and must not be relied on, but there is no equivalent
    statement of stability for the operations, request bodies or response bodies.
